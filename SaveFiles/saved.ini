; This is an .INI file, used as a simple way to tune a game without recompiling/hardcoding it.
; A great place for gameplay variables and more. Another example of data-driven programming. 
[Level1]
levelFile=../Levels/Test1.json
modelPath=../Levels/Models
[Player]
model=FreeCam
moveSpeed=8.0
camSpeed=1.0
[Sun]
model=Sun
[Mercury]
model=Mercury
[Venus]
model=Venus
[Earth]
model=Earth
[Mars]
model=Mars
[Jupiter]
model=Jupiter
[Saturn]
model=Saturn
[Uranus]
model=Uranus
[Neptune]
model=Neptune
[Shaders]
pixel=../Shaders/LevelPixel.hlsl
vertex=../Shaders/LevelVertex.hlsl
[Window]
height=768
width=1024
xstart=100
ystart=100
[Render]
near=0.001
far=1000
fov=90
; If you change this file it will replace the saved.ini version if its newer. 
